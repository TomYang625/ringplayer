<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#121016">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<title>环形播放器</title>
<style>
  :root{
    --bg:#121016; --surface:#1a1720; --surface2:#211e29; --chip:#332b61;
    --txt:#e9e7ee; --sub:#b9b4c2; --accent:#E9EDF2; --track:#9AA1AB; --err:#ffb4ab;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Roboto,sans-serif;overflow:hidden}
  #app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding:max(12px,env(safe-area-inset-top)) 16px calc(10px + env(safe-area-inset-bottom));position:relative}
  header{display:flex;align-items:center;gap:8px}
  .head-txt{flex:1;min-width:0}
  #title{font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #subtitle{font-size:12px;color:var(--sub);margin-top:2px}
  #errorMsg{font-size:12px;color:var(--err);margin-top:4px;display:none}
  #jsok{display:none;color:#7bd88f;font-size:11px;margin-top:4px}
  .btn{flex:none;border:0;border-radius:20px;background:var(--chip);color:var(--txt);font-size:13px;height:34px;padding:0 12px;cursor:pointer}
  .btn:active{opacity:.7}
  /* 面板是圆环容器内的浮层：不参与布局，所以开合既不改变圆环的空间（圆环大小不受面板/字幕影响），
     也永远不会盖住容器外的字幕行；自身超高时内部滚动，最外还有容器 overflow:hidden 兜底。 */
  #panel,#ratePanel,#subPanel{position:absolute;left:0;right:0;top:0;z-index:6;
    background:var(--surface);border-radius:14px;padding:12px 14px;max-height:100%;overflow:auto;
    box-shadow:0 8px 28px rgba(0,0,0,.5)}
  #panel .row,#ratePanel .row,#subPanel .row{display:flex;align-items:center;gap:10px}
  #panel input[type=range],#ratePanel input[type=range]{flex:1}
  #panel small,#ratePanel small,#subPanel small{color:var(--sub)}
  #rateChips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
  #rateChips button{flex:1;min-width:0;border:0;border-radius:12px;background:var(--chip);color:var(--txt);height:30px;font-size:13px;cursor:pointer}
  #rateChips button.active{background:var(--accent);color:#121016;font-weight:700}
  #dialWrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden;position:relative}
  #dial{position:relative;width:min(80vw,70vh,360px);aspect-ratio:1/1;touch-action:none;user-select:none;-webkit-user-select:none}
  #discBase,#disc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%}
  #discBase{background:var(--track);width:86%;height:86%}
  #disc{width:86%;height:86%;background:conic-gradient(from -90deg, var(--accent) 0deg 0deg, transparent 0deg)}
  #hole{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:var(--bg);width:58%;height:58%}
  #knobWrap{position:absolute;left:50%;top:50%;width:0;height:0;transform-origin:0 0;transform:rotate(0deg);pointer-events:none}
  #knob{position:absolute;left:-6px;top:0;width:12px;height:12px;border-radius:50%;background:var(--accent)}
  #scrubTip{position:absolute;left:50%;top:8%;transform:translateX(-50%);display:none;pointer-events:none;background:var(--surface2);color:var(--accent);font-size:15px;font-weight:600;padding:4px 14px;border-radius:14px;white-space:nowrap;letter-spacing:.3px;z-index:5}
  #centerBtn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:34%;aspect-ratio:1/1;border-radius:50%;border:0;background:var(--surface2);color:var(--txt);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
  #centerBtn svg{width:40%;height:40%}
  #centerBtn:active{opacity:.8}
  #timeRow{display:flex;justify-content:space-between;font-size:16px;color:var(--sub);font-variant-numeric:tabular-nums;margin-top:2px}
  #cur{color:var(--accent);font-weight:600}
  #seek{width:100%;accent-color:var(--accent);margin:2px 0 6px}
  #hint{text-align:center;font-size:12px;color:var(--sub);margin-bottom:8px}
  #tracksHead{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--sub)}
  #list{list-style:none;margin:6px 0 0;padding:0;overflow-y:auto;max-height:26vh}
  #list li{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px}
  #list li.current{background:var(--surface2)}
  #list li .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
  #list li button{flex:none;border:0;background:transparent;color:var(--sub);font-size:13px;padding:2px 6px;border-radius:6px}
  #list li button:hover{background:var(--surface2)}
  #fileInput{display:none}
  #subline{display:none;text-align:center;font-size:18px;line-height:1.35;color:var(--accent);margin:8px 2px 0;overflow:hidden;min-height:0}
  #subline.on{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  #subList{max-height:30vh;overflow-y:auto;margin-top:6px;font-size:16px}
  #subList .row{padding:7px 8px;border-radius:8px;cursor:pointer;color:var(--sub)}
  #subList .row.on{background:var(--surface2);color:var(--txt);font-weight:600}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="head-txt">
      <div id="title">环形播放器</div>
      <div id="subtitle">点右上角「打开」选择 mp3</div>
      <div id="errorMsg"></div>
      <div id="jsok">JS 运行中</div>
    </div>
    <button class="btn" id="btnSub">字幕</button>
    <button class="btn" id="btnRate">倍速</button>
    <button class="btn" id="btnSens">灵敏度</button>
    <button class="btn" id="btnOpen">打开</button>
  </header>

  <div id="dialWrap">
    <div id="panel" hidden>
      <div class="row">
        <span style="font-size:13px;white-space:nowrap">一整圈≈</span>
        <b id="sensVal">30 秒</b>
        <input type="range" id="sens" min="1" max="600" step="1" value="30">
        <button class="btn" id="sensReset" style="height:28px;padding:0 8px">默认</button>
      </div>
      <small>顺时针转 = 前进，逆时针 = 后退；数值越大，同样滑动跳过的时长越多。</small>
    </div>

    <div id="ratePanel" hidden>
      <div class="row">
        <span style="font-size:13px;white-space:nowrap">播放倍速</span>
        <b id="rateVal">1.0×</b>
        <input type="range" id="rate" min="0.5" max="2" step="0.05" value="1">
        <button class="btn" id="rateReset" style="height:28px;padding:0 8px">默认</button>
      </div>
      <div id="rateChips"></div>
      <small>0.5×–2.0×，小于 1× 为慢速播放；选完即生效，换歌后仍保持。</small>
    </div>

    <div id="subPanel" hidden>
      <div class="row"><b id="subStatus">字幕</b><span style="flex:1"></span>
        <button class="btn" id="subStart" style="height:28px;padding:0 8px">生成字幕</button>
        <button class="btn" id="subStop" style="height:28px;padding:0 8px" hidden>停止</button>
        <button class="btn" id="subDel" style="height:28px;padding:0 8px" hidden>删除</button>
      </div>
      <div class="row" id="subModelRow">
        <span style="font-size:13px;white-space:nowrap">模型</span>
        <select id="subModel" style="flex:1">
          <option value="tiny">tiny.en · 39MB · 最快</option>
          <option value="base">base.en · 73MB · 推荐</option>
          <option value="small">small.en · 238MB · 更准</option>
        </select>
      </div>
      <div class="row" id="subExportRow" hidden>
        <button class="btn" id="subSrt" style="height:28px;padding:0 8px">导出 .srt</button>
        <button class="btn" id="subTxt" style="height:28px;padding:0 8px">导出 .txt</button>
      </div>
      <small id="subHint">首次使用会从镜像下载模型并缓存在本机；之后离线可用。转写时请保持屏幕常亮。
        档位差别很大：tiny.en 最快（先用它试通），base.en 更准但慢好几倍，small.en 最准也最慢。</small>
      <div id="subList"></div>
    </div>

    <div id="dial">
      <div id="discBase"></div>
      <div id="disc"></div>
      <div id="hole"></div>
      <div id="knobWrap"><div id="knob"></div></div>
      <div id="scrubTip"></div>
      <button id="centerBtn" aria-label="播放或暂停">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
      </button>
    </div>
  </div>

  <div id="subline"></div>
  <div id="timeRow"><span id="cur">0:00</span><span id="dur">0:00</span></div>
  <input type="range" id="seek" min="0" max="1000" value="0">
  <div id="hint">顺时针滑动圆环：快进 · 逆时针：后退 · 点中央：播放/暂停 · 播完自动重播</div>

  <div id="tracksHead"><span>我的歌曲</span><button class="btn" id="btnAddMore" style="height:26px;padding:0 8px">+ 添加</button></div>
  <ul id="list"></ul>

  <input type="file" id="fileInput" accept="audio/*,.mp3,.m4a,.wav,.ogg,.aac,.flac" multiple>
</div>

<script>
'use strict';
/* ============ 常量 / 工具 ============ */
const A = id => document.getElementById(id);
const audio = new Audio();
audio.preload = 'auto';
let tracks = [];        // {key,name,blob,url}
let cur = -1;
let duration = 0;
let dragging = false;
let dragTarget = 0;
let rafId = null;

const TWO_PI = Math.PI * 2;
const fmt = ms => {
  ms = Math.max(0, ms);
  const t = Math.floor(ms / 1000), h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  const p = n => (n < 10 ? '0' + n : '' + n);
  return h > 0 ? h + ':' + p(m) + ':' + p(s) : m + ':' + p(s);
};

/* ============ 设置 ============ */
const LS = {
  get(o, d) { try { const v = localStorage.getItem(o); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(o, v) { try { localStorage.setItem(o, JSON.stringify(v)); } catch (e) {} }
};
let secondsPerTurn = LS.get('spt', 30);
const RATES = [0.5, 0.75, 1, 1.25, 1.5, 2];
let rate = LS.get('rate', 1);
let posMap = LS.get('posMap', {});
const curKey = () => (cur >= 0 && tracks[cur]) ? tracks[cur].key : null;

/* ============ IndexedDB：记住选过的几首歌 ============ */
const CAP_COUNT = 6, CAP_BYTES = 300 * 1024 * 1024;
let db = null;
/* ============ IndexedDB：字幕（v2 起） ============ */
const DB_VERSION = 2;
function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open('ringplayer', DB_VERSION);
    req.onupgradeneeded = () => {
      const d = req.result;
      if (!d.objectStoreNames.contains('tracks')) d.createObjectStore('tracks', { keyPath: 'key' });
      if (!d.objectStoreNames.contains('subs')) d.createObjectStore('subs', { keyPath: 'key' });
    };
    req.onsuccess = () => { db = req.result; res(); };
    req.onerror = () => rej(req.error);
  });
}
function subGet(key) {
  return new Promise(r => { if (!db) return r(null);
    const q = db.transaction('subs', 'readonly').objectStore('subs').get(key);
    q.onsuccess = () => r(q.result || null); q.onerror = () => r(null); });
}
// 写失败必须 reject：调用方要如实告诉用户"没保存"，不能报成功（QuotaExceededError 就是这条路径）
function subPut(rec) {
  return new Promise((res, rej) => {
    if (!db) return rej(new Error('本地数据库未打开'));
    let t;
    try { t = db.transaction('subs', 'readwrite'); } catch (e) { return rej(e); }
    t.objectStore('subs').put(rec);
    t.oncomplete = () => res();
    t.onerror = () => rej(t.error || new Error('写入失败'));
    t.onabort = () => rej(t.error || new Error('写入被中止'));
  });
}
function subDelete(key) {
  return new Promise(r => { if (!db) return r();
    const t = db.transaction('subs', 'readwrite'); t.objectStore('subs').delete(key); t.oncomplete = () => r(); t.onerror = () => r(); });
}
function dbPut(rec) { return new Promise(r => { const t = db.transaction('tracks', 'readwrite'); t.objectStore('tracks').put(rec); t.oncomplete = r; }); }
function dbGetAll() { return new Promise(r => { const t = db.transaction('tracks', 'readonly'); const q = t.objectStore('tracks').getAll(); q.onsuccess = () => r(q.result || []); }); }
function dbDelete(key) { return new Promise(r => { const t = db.transaction('tracks', 'readwrite'); t.objectStore('tracks').delete(key); t.oncomplete = r; }); }
async function persistFile(file) {
  if (!db) return;
  const key = file.name + '|' + file.size + '|' + (file.lastModified || 0);
  const rows = await dbGetAll();
  if (rows.some(x => x.key === key)) return;
  let total = rows.reduce((s, x) => s + (x.blob ? x.blob.size : 0), 0);
  if (rows.length >= CAP_COUNT || total + file.size > CAP_BYTES) return; // 超出容量：仅本次会话可用
  try { await dbPut({ key, name: file.name, blob: file }); } catch (e) { /* 空间不足则忽略 */ }
}

/* ============ DOM ============ */
const dial = A('dial'), disc = A('disc'), discBase = A('discBase'), hole = A('hole'),
      knobWrap = A('knobWrap'), centerBtn = A('centerBtn'),
      playIcon = A('playIcon'), pauseIcon = A('pauseIcon'),
      curEl = A('cur'), durEl = A('dur'), seekEl = A('seek'),
      titleEl = A('title'), subEl = A('subtitle'), errEl = A('errorMsg'),
      listEl = A('list'), fileInput = A('fileInput'),
      panel = A('panel'), sensEl = A('sens'), sensVal = A('sensVal'),
      ratePanel = A('ratePanel'), rateEl = A('rate'), rateVal = A('rateVal'), rateChips = A('rateChips'),
      btnOpen = A('btnOpen'), btnSens = A('btnSens'), sensReset = A('sensReset'),
      btnRate = A('btnRate'), rateReset = A('rateReset'), btnAddMore = A('btnAddMore');

function setErr(s) { errEl.textContent = s || ''; errEl.style.display = s ? 'block' : 'none'; }

/* ============ 环形绘制尺寸 ============ */
let geo = { cx: 0, cy: 0, vcx: 0, vcy: 0, outer: 0, inner: 0, mid: 0, W: 0, H: 0 };
// 指针事件给的是 viewport 坐标（clientX/Y），而 geo.cx/cy 是 dial 的局部坐标（用于 CSS 定位）；
// 两者不能混用，所以圆心另存一份 viewport 坐标给 dist()/angleOf() 用。
function syncOrigin(r) {
  r = r || dial.getBoundingClientRect();
  geo.vcx = r.left + r.width / 2;
  geo.vcy = r.top + r.height / 2;
}
function layout() {
  const r = dial.getBoundingClientRect();
  const side = Math.min(r.width, r.height);
  geo.W = r.width; geo.H = r.height;
  geo.cx = r.width / 2; geo.cy = r.height / 2;
  syncOrigin(r);
  geo.outer = side * 0.46;
  geo.inner = side * 0.32;
  geo.mid = (geo.outer + geo.inner) / 2;
  const D = (x) => (x * 2).toFixed(1) + 'px';
  // 圆心位置由 CSS(left:50%; translate(-50%))统一处理，这里只按像素覆盖直径
  discBase.style.width = D(geo.outer); discBase.style.height = D(geo.outer);
  disc.style.width = D(geo.outer); disc.style.height = D(geo.outer);
  hole.style.width = D(geo.inner); hole.style.height = D(geo.inner);
  knobWrap.style.left = geo.cx + 'px'; knobWrap.style.top = geo.cy + 'px';
  A('knob').style.top = -(geo.mid + 6) + 'px';
}
// 圆环尺寸直接用像素写死：不依赖 aspect-ratio / min()，避免容器算成 0 导致环不显示
function sizeDial() {
  const wrap = document.getElementById('dialWrap').getBoundingClientRect();
  let availW = window.innerWidth;
  let availH = window.innerHeight;
  if (wrap && wrap.width > 0) availW = wrap.width;
  if (wrap && wrap.height > 0) availH = wrap.height;
  // 下限只保 1px：容器被面板/文稿压矮时，圆环必须老老实实缩小，绝不允许溢出容器
  // （溢出会被下面的字幕行"按盒子"压住；容器已设 overflow:hidden，但那只裁画面、不解决问题）
  const side = Math.max(1, Math.min(availW, availH, 360));
  dial.style.width = side + 'px';
  dial.style.height = side + 'px';
  layout();
  paint();
}
window.addEventListener('resize', () => sizeDial());

/* ============ 进度绘制 ============ */
function fracNow() {
  if (!duration) return 0;
  return Math.min(1, Math.max(0, (dragging ? dragTarget : audio.currentTime * 1000) / duration));
}
function paint() {
  const f = fracNow();
  const deg = Math.round(f * 360);
  disc.style.background = 'conic-gradient(from -90deg, var(--accent) 0deg ' + deg + 'deg, transparent ' + deg + 'deg)';
  knobWrap.style.transform = 'rotate(' + deg + 'deg)';
  curEl.textContent = fmt(dragging ? dragTarget : audio.currentTime * 1000);
  durEl.textContent = fmt(duration);
  seekEl.value = Math.round(f * 1000);
  subSyncLine(dragging ? dragTarget : audio.currentTime * 1000);
}
function rafLoop() { paint(); rafId = requestAnimationFrame(rafLoop); }
function startLoop() { if (!rafId) rafId = requestAnimationFrame(rafLoop); }
function stopLoop() { if (rafId) { cancelAnimationFrame(rafId); rafId = null; } }

/* ============ 播放核心 ============ */
function setPlaying(playing) {
  playIcon.style.display = playing ? 'none' : 'block';
  pauseIcon.style.display = playing ? 'block' : 'none';
}
function revoke(t) { if (t && t.url) { URL.revokeObjectURL(t.url); t.url = null; } }

function playCurrent() {
  const t = tracks[cur];
  if (!t) return;
  if (!t.url) t.url = URL.createObjectURL(t.blob);
  audio.src = t.url;
  duration = 0;
  audio.loop = true;                  // 单曲无限循环：播完自动从头再播
  audio.defaultPlaybackRate = rate;   // 换 src 会重置倍速为 1，这里重新应用
  audio.playbackRate = rate;
  const pos = posMap[t.key] || 0;
  const p = audio.play ? audio.play.bind(audio) : ()=>{};
  audio.onloadedmetadata = () => {
    duration = audio.duration * 1000;
    audio.playbackRate = rate;
    if (pos > 0 && pos < duration) { try { audio.currentTime = pos / 1000; } catch (e) {} }
    subEl.textContent = '已就绪';
    renderSubPanel();   // 元数据到了，刷新面板（"这段约需多久"要靠时长才算得出来）
  };
  audio.onerror = () => setErr('无法播放该文件');
  audio.ontimeupdate = () => {
    if (!dragging) {
      if (Math.random() < 0.15) { posMap[t.key] = audio.currentTime * 1000; LS.set('posMap', posMap); }
      paint();
    }
  };
  // 不自动播放，等用户点中央（符合浏览器自动播放策略）
}

function selectTrack(i, autoplay) {
  if (i === cur) { if (autoplay) toggle(); return; }
  cur = i; dragging = false;
  audio.pause();
  revoke(tracks[cur]);          // 上一首的 url 可复用给当前，安全起见重新生成
  const keep = tracks[i]; keep.url = null;
  titleEl.textContent = keep.name;
  playCurrent();
  renderList();
  subOnTrackChanged();
  if (autoplay) toggle();
  else subEl.textContent = '点击中央开始播放';
}

function toggle() {
  if (cur < 0) { openFiles(); return; }
  if (audio.paused) {
    const pr = audio.play();
    if (pr && pr.catch) pr.catch(() => setErr('需再点一次播放（浏览器自动播放限制）'));
    setPlaying(true);
  } else {
    audio.pause(); setPlaying(false);
    const k = curKey(); if (k) { posMap[k] = audio.currentTime * 1000; LS.set('posMap', posMap); }
  }
}

/* ============ 选文件 ============ */
function openFiles() {
  if (!db) openDB();
  fileInput.click();
}
fileInput.addEventListener('change', async () => {
  const files = Array.from(fileInput.files || []);
  fileInput.value = '';
  if (!files.length) return;
  let added = [];
  for (const f of files) {
    tracks.push({ key: f.name + '|' + f.size + '|' + (f.lastModified || 0), name: f.name, blob: f, url: null });
    added.push(persistFile(f));
  }
  await Promise.all(added);
  renderList();
  selectTrack(tracks.length - files.length, true);
});
btnOpen.addEventListener('click', openFiles);
btnAddMore.addEventListener('click', openFiles);

/* ============ 列表渲染 / 从库里加载 ============ */
function renderList() {
  listEl.innerHTML = '';
  tracks.forEach((t, i) => {
    const li = document.createElement('li');
    if (i === cur) li.className = 'current';
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = t.name;
    const play = document.createElement('button'); play.textContent = '播放';
    const del = document.createElement('button'); del.textContent = '删除';
    play.addEventListener('click', () => selectTrack(i, true));
    del.addEventListener('click', async () => {
      const k = t.key;

  if (delta > Math.PI) delta -= TWO_PI; else if (delta < -Math.PI) delta += TWO_PI;
  dragState.last = a;
  if (delta !== 0) {

    const msPerRad = secondsPerTurn * 1000 / TWO_PI;
    const target = Math.max(0, Math.min(dragState.base + dragState.acc * msPerRad, duration));
    dragTarget = target;
    try { audio.currentTime = target / 1000; } catch (err) {}

  if (c) { try { c(); } catch (e) {} }

async function startAsrJob({ audio, model, lang, onMsg, workerType = 'module', startSeg = 0 }) {

  const done = new Promise((resolve, reject) => {
    subWorkerCancel = () => { const e = new Error('已取消'); e.__asrCancelled = true; reject(e); };

// 音频 → 16k 单声道（Task 1 已验证的实现）
// 复用一个 AudioContext，而且**首次创建必须发生在用户手势任务内**（subStart 里第一件事就调它）：
// iOS 上在 await 之后再创建，上下文会以 suspended 状态出现，decodeAudioData 随之失败——
// 这正是"点生成后报格式不支持"最常见的原因。复用还顺带解决了 Safari 对同时存活数量的硬限。
// 请求 16000Hz：decodeAudioData 会直接按该采样率解码，省掉一次 OfflineAudioContext 重采样，
// 中间缓冲也只有原生采样率的约 1/3（长音频在 iPad 上最容易失败的就是这一步的内存）。
// 判定"这台设备的 WebKit 太老，做不了离线识别"。
// 依据：iPadOS 13+ 的 Safari 用桌面式 UA，UA 里没有 "OS 14_"，但 Version/ 与系统大版本基本同步；
// iPad 上的 Chrome/Firefox 也跑 WebKit，UA 里带 "OS 14_4" 之类，同样能识别。
// 判错只影响"要不要直接给提示"：判成旧设备 = 不尝试 Worker（不崩）；判成新设备 = 照常尝试（可能失败但有兜底）。
function asrUnsupportedOS() {

  const os = /OS (\d+)[_.]/.exec(ua);
  const ver = /Version\/(\d+)/.exec(ua);
  const osMajor = os ? +os[1] : 0;
  const safariMajor = ver ? +ver[1] : 0;
  return (osMajor > 0 && osMajor < 15) || (safariMajor > 0 && safariMajor < 15);

let decodeCtx = null;

  if (decodeCtx.state === 'suspended' && decodeCtx.resume) decodeCtx.resume().catch(() => {});

async function decodeToMono16k(blob) {
  const ab = await blob.arrayBuffer();
  // iOS 上从 iCloud/「文件」里选中的音频如果还没下载到本机：<audio> 能边下边播，
  // 但读字节会拿到空数据，decodeAudioData 随即报"格式不支持"——文案会把人带偏。
  if (!ab.byteLength) {
    throw subUserErr('读到的文件是空的（0 字节，共 ' + (blob.size / 1048576).toFixed(1) + 'MB）：'
      + '若这首歌在 iCloud 或「文件」里还没下载到本机，请先在「文件」App 里把它下载下来再试');
  }
  const ac = getDecodeCtx();
  const buf = await ac.decodeAudioData(ab);
  const n = Math.ceil(buf.duration * 16000);
  if (buf.sampleRate === 16000) {            // 常规路径：已是 16kHz，只需降为单声道
    const out = new Float32Array(n);
    if (buf.numberOfChannels === 1) {
      out.set(buf.getChannelData(0).subarray(0, n));
    } else {
      for (let c = 0; c < buf.numberOfChannels; c++) {
        const d = buf.getChannelData(c);
        for (let i = 0; i < n; i++) out[i] += d[i];
      }
      for (let i = 0; i < n; i++) out[i] /= buf.numberOfChannels;
    }
    return out;
  }
  // 老浏览器会忽略 sampleRate 选项 → 退回 OfflineAudioContext 重采样（顺带降为单声道）
  const off = new OfflineAudioContext(1, n, 16000);
  const src = off.createBufferSource();
  src.buffer = buf; src.connect(off.destination); src.start();
  const rendered = await off.startRendering();
  return rendered.getChannelData(0).slice();
}

  subTimer = setInterval(() => { if (sub.state === 'running') renderSubPanel(); }, 1000);
  try {
    if (!t.url) t.url = URL.createObjectURL(t.blob);
    // 超长音频在解码前就挡掉：decodeAudioData 要把整段解成原始采样率的 float32
    // （1 小时立体声 ≈1.3GB），Safari 上必然在解码里失败，且那条失败信息无法与"文件解不开"区分。
    if (isFinite(audio.duration) && audio.duration > SUB_MAX_SEC) throw subUserErr(SUB_TOO_LONG_ERR);
    let samples;
    try {
      samples = await decodeToMono16k(t.blob);
    } catch (e) {
      // 解码要单独给文案：此刻 dlPct 还是 0，而浏览器的解码报错（"Failed to execute..."）会被
      // 下面的下载失败正则吃掉，让用户对着一个永远解不开的文件去查网络、反复点重试。
      // 附带底层原因（NotSupportedError / 内存不足 …）：否则出了事用户和我们都不知从何判断
      const why = (e && (e.name || e.message)) || '';
      throw subUserErr(SUB_DECODE_ERR + (why ? '（' + why + '）' : ''));
    }
    if (job !== subJob) return;
    sub.totalSec = samples.length / 16000;
    // 上一次若在同一首歌上中断过（partial 记录），把已完成的分段读回来，从那里接着转，不重复劳动。
    let chunks = [], doneSeg = 0, gotSeg = false;
    const prev = await subGet(key);
    if (job !== subJob) return;
    if (prev && prev.partial && prev.doneSeg > 0 && prev.model === SUB_MODELS[subModel].id) {
      chunks = prev.chunks || [];
      doneSeg = prev.doneSeg;
    }
    sub.segDone = doneSeg;
    sub.segTotal = Math.max(1, Math.ceil(sub.totalSec / SUB_SEG_SEC));
    sub.phase = 'prep';                 // 解码完毕 → 接下来是下载/加载模型
    subRunMark('prep');
    renderSubPanel();
    const runJob = (workerType) => startAsrJob({
      audio: samples, model: SUB_MODELS[subModel].id, lang: SUB_LANG, workerType, startSeg: doneSeg,
      onMsg: (d) => {
        if (job !== subJob) return;
        sub.lastAt = Date.now();
        if (d.type === 'boot') { sub.booted = true; renderSubPanel(); }
        else if (d.type === 'download') {
          sub.dlLoaded = d.loaded; sub.dlTotal = d.total;
          sub.dlPct = d.total ? d.loaded / d.total : 0;
          renderSubPanel();
        } else if (d.type === 'ready') {
          sub.phase = 'transcribe'; sub.device = d.device || '';
          sub.tTrans = Date.now();    // 记下转写起点，跑完据此换算本机倍速
          subRunMark('transcribe');   // 崩溃多发生在这一步，落地留痕（含后端）
          renderSubPanel();
        } else if (d.type === 'seg') {
          // 一段转完就落盘：页面若在这之后被系统干掉，下次可从这一段接着转。
          gotSeg = true;
          chunks = chunks.concat(d.chunks || []);
          sub.segDone = d.i + 1; sub.device = d.device || sub.device;
          subRunMark('transcribe');
          subPut({ key, model: SUB_MODELS[subModel].id, lang: SUB_LANG, createdAt: Date.now(),
                   durationSec: sub.totalSec, chunks: chunks, doneSeg: sub.segDone, partial: true });
          renderSubPanel();
        } else if (d.type === 'done') {
          // 只有"收到过分段结果"时才采纳 done 里的整体结果：续转时 done 只含本次跑过的段，
          // 直接覆盖会把上次已完成的前缀丢掉（这条 bug 是实测抓到的）。测试替身只发 done，故保留此路。
          if (!gotSeg && d.chunks && d.chunks.length) chunks = d.chunks;
        }
      },
    });
    try {
      await runJob('module');
    } catch (e) {
      if (!e || !e.__startupFailed) throw e;
      // 模块型内联 Worker 一条消息都没发出来就挂了（旧版 Safari 常见）→ 换经典 Worker 形式再试一次。
      // 上一次 postMessage 已经把 samples 的 buffer transfer 走了，所以必须重新解码。
      sub.phase = 'decode'; sub.booted = false;
      sub.dlLoaded = 0; sub.dlTotal = 0; sub.dlPct = 0;
      renderSubPanel();
      samples = await decodeToMono16k(t.blob);
      if (job !== subJob) return;
      sub.phase = 'prep'; renderSubPanel();
      await runJob('classic');
    }
    if (job !== subJob) return;
    // 库返回 chunks[].timestamp = [起, 止]；末段可能给 [起, null]，缺结束时间时用音频总时长兜底
    const chunksOut = (chunks || []).map(c => {
      const ts = c.timestamp || [];
      const s = c.s !== undefined ? c.s : (ts[0] || 0);
      let e = c.e !== undefined ? c.e : (ts[1] != null ? ts[1] : null);
      if (e == null || e < s) e = Math.max(s, sub.totalSec);
      return { s, e, text: (c.text || '').trim() };
    }).filter(c => c.text);
    const rec = { key, model: SUB_MODELS[subModel].id, lang: SUB_LANG, createdAt: Date.now(),
                  durationSec: sub.totalSec, chunks: chunksOut,
                  doneSeg: sub.segTotal, partial: false };
    sub.rec = rec; sub.state = rec.chunks.length ? 'done' : 'error';
    if (!rec.chunks.length) sub.err = '这段音频没识别出任何句子';
    else {
      try { await subPut(rec); }
      catch (e) {
        // 落库失败（QuotaExceededError 等）不能报成功：文稿只在内存里，重开页面就没了。
        // 状态仍是 done（文稿确实生成了，导出、跟读都能用），只是状态行如实带一句警告。
        if (job !== subJob) return;
        sub.warn = SUB_SAVE_WARN;
      }
    }
  } catch (e) {
    if (e && e.__asrCancelled) return;   // 停止/切歌造成的取消：静默收场，绝不当错误抛给用户
    if (job !== subJob) return;
    const msg = String((e && e.message) || e);
    if (e && e.__userFacing) sub.err = msg;   // 解码失败/超长：文案已经是给用户看的，不再映射
    else if (/memory|allocation|RangeError/i.test(msg)) sub.err = '内存不足：改用 base 或 tiny 档再试';
    else if (sub.dlPct < 1 && /fetch|network|HTTP|Failed/i.test(msg)) sub.err = '模型下载失败（检查网络/镜像），点重试';
    else if (/worker 出错|识别器启动失败/.test(msg))
      sub.err = '识别器没能启动：这个浏览器可能不支持离线识别所需的 Worker 方式（两种形式都试过了）。'
              + '请把这一整行发给开发者——' + navigator.userAgent;
    else sub.err = '转写失败：' + msg;
    sub.state = 'error';
    subWakeOff();
  }
  // 记下本机这次的实际速度（音频秒 ÷ 转写秒），下次生成前就能预估要等多久
  if (sub.tTrans && sub.totalSec > 0) {
    const secs = (Date.now() - sub.tTrans) / 1000;
    const rate = secs > 0.5 ? sub.totalSec / secs : 0;
    if (isFinite(rate) && rate > 0) {
      const sp = LS.get(SUB_LS_SPEED, {}) || {};
      sp[SUB_MODELS[subModel].id] = rate;
      LS.set(SUB_LS_SPEED, sp);
    }
  }
  subClearTimer();
  subRunClear();     // 正常跑完（或已知错误）→ 清掉"中断留痕"，免得下次误判为崩溃
  renderSubPanel();
  renderSubList();
  subSyncLine(audio.currentTime * 1000, true);
  subWakeOff();
}

function subStop() { subJob++; cancelAsrJob(); subClearTimer(); subWakeOff(); subRunClear(); sub.state = sub.rec ? 'done' : 'ready'; renderSubPanel(); }
function subClearTimer() { if (subTimer) { clearInterval(subTimer); subTimer = null; } }

/* ============ 字幕：同步 ============ */
let subIdx = -1;
function subSyncLine(ms, force) {
  const cs = sub.rec && sub.rec.chunks;
  if (!cs) {
    if (subIdx !== -1 || force) { subIdx = -1; subLineEl.textContent = ''; subLineEl.classList.remove('on'); }
    return;
  }
  const t = ms / 1000;
  let i = subIdx;
  if (i < 0 || i >= cs.length || t < cs[i].s) {          // 回退或跳转：二分
    let lo = 0, hi = cs.length - 1, found = -1;
    while (lo <= hi) { const m = (lo + hi) >> 1;
      if (cs[m].s <= t) { found = m; lo = m + 1; } else hi = m - 1; }
    i = found;
  } else {
    while (i + 1 < cs.length && t >= cs[i + 1].s) i++;    // 前进：只往前挪
  }
  if (i === subIdx && !force) return;
  subIdx = i;
  const c = cs[i];
  subLineEl.textContent = c ? c.text : '';
  subLineEl.classList.toggle('on', !!c);
  const rows = subListEl.children;
  for (let k = 0; k < rows.length; k++) rows[k].classList.toggle('on', k === i);
  if (i >= 0 && rows[i] && rows[i].scrollIntoView) rows[i].scrollIntoView({ block: 'nearest' });
}

/* ============ 字幕：面板 ============ */
const subPanel = A('subPanel'), subListEl = A('subList'), subLineEl = A('subline');
function showPanel(name) {
  panel.hidden = name !== 'sens';
  ratePanel.hidden = name !== 'rate';
  subPanel.hidden = name !== 'sub';
  renderSubPanel();   // 打开面板正是用户读那行字的时候；顺带刷新"预计要等多久"（它依赖音频元数据）
}
function renderSubPanel() {
  const st = A('subStatus'), start = A('subStart'), stop = A('subStop'), del = A('subDel');
  const running = sub.state === 'running';
  start.hidden = running || sub.state === 'done' || !tracks[cur];
  stop.hidden = !running;
  del.hidden = !sub.rec || running;
  A('subModelRow').hidden = !!sub.rec;
  A('subExportRow').hidden = sub.state !== 'done';
  A('subModel').value = subModel;
  start.textContent = sub.state === 'error' ? '重新生成' : '生成字幕';
  if (!tracks[cur]) st.textContent = '先选一首歌，再生成字幕';
  else if (sub.state === 'none') st.textContent = '字幕';
  else if (sub.state === 'ready') {
    // 有实测倍速就预估耗时：让用户点之前就知道要等多久，而不是点完干等
    const rate = (LS.get(SUB_LS_SPEED, {}) || {})[SUB_MODELS[subModel].id];
    const dur = isFinite(audio.duration) ? audio.duration : 0;
    const est = (rate && dur) ? '，本机约 ' + rate.toFixed(1) + ' 倍速，这段约需 ' + fmtElapsed(dur / rate) : '';
    st.textContent = '生成字幕（英文 · 首次下载约 ' + SUB_MODELS[subModel].mb + 'MB）' + est;
  }
  else if (sub.state === 'running') {
    // 三个阶段都带上"已用时长"：实时可见，用户就不必猜它是不是卡住了
    const el = fmtElapsed((Date.now() - sub.t0) / 1000);
    if (sub.phase === 'transcribe') {
      const segTxt = sub.segTotal > 1 ? '已转写 ' + sub.segDone + '/' + sub.segTotal + ' 段，' : '';
      st.textContent = '转写中…（' + segTxt + '已用 ' + el + '，音频 ' + Math.round(sub.totalSec) + 's'
        + (sub.device ? '，' + sub.device : '') + '，请保持屏幕常亮）'
        // 阈值取 2 分钟：实测 token 回调在 ASR 上是"随内容密度"触发的（近乎静音时很少），
        // 阈值太激进会在正常但缓慢的转写里误报"进程已被回收"。
        + (Date.now() - sub.lastAt > 120000
            ? '——已 2 分钟没有任何进展，识别进程可能已被系统回收（内存不足）。'
              + '建议改用 tiny 档或更短的音频，点「停止」后重试'
            : '');
    } else if (sub.phase === 'decode') {
      st.textContent = '正在读取音频…（已用 ' + el + '）';
    } else if (!sub.booted) {
      // Worker 还没回报"我起来了"。这一步在 Safari 上是有可能失败的（内联 Worker + 外部模块），
      // 所以超过 10 秒就明说卡在哪，别让用户对着计时无限等。
      st.textContent = '正在启动识别器…（已用 ' + el + '）'
        + (Date.now() - sub.t0 > 10000 ? '——一直停在这里说明这个浏览器没能启动识别器，可点「停止」后重试' : '');
    } else if (sub.dlLoaded === 0) {
      // 首个进度事件到达前（要先把识别库从 CDN 拉下来）：说清楚在干什么，
      // 否则这里会显示"已下载 0.0MB"十几秒，看着像卡住。
      st.textContent = '正在加载识别库…（已用 ' + el + '）';
    } else {
      const mb = (sub.dlLoaded / 1048576).toFixed(1)
        + (sub.dlTotal ? ' / ' + (sub.dlTotal / 1048576).toFixed(1) : '') + 'MB';
      st.textContent = '正在准备模型…' + (sub.dlTotal ? Math.round(sub.dlPct * 100) + '%，' : '')
        + '已下载 ' + mb + '（已用 ' + el + '，首次可能要几分钟）'
        + (Date.now() - sub.lastAt > 30000 ? '——已 30 秒无下载进展，可点「停止」后重试' : '');
    }
  }
  else if (sub.state === 'done') st.textContent = '字幕已生成（' + sub.rec.chunks.length + ' 句'
      + (sub.device ? ' · ' + sub.device : '') + '）' + (sub.warn ? '，但' + sub.warn : '');
  else st.textContent = sub.err || '失败';
  // 「上次生成在哪一步中断」的提示：挂在任何状态后面显示，直到用户再点一次生成
  if (sub.crash) st.textContent += ' · ' + sub.crash;
}
function fmtElapsed(sec) {
  const s = Math.max(0, Math.round(sec));
  if (s < 60) return s + 's';
  const m = Math.floor(s / 60), r = s % 60;
  return r ? m + '分' + r + '秒' : m + '分钟';
}
function renderSubList() {
  subListEl.innerHTML = '';
  if (!sub.rec) return;
  sub.rec.chunks.forEach((c, i) => {
    const d = document.createElement('div');
    d.className = 'row'; d.dataset.i = i; d.textContent = c.text;
    d.addEventListener('click', () => { audio.currentTime = c.s; paint(); });
    subListEl.appendChild(d);
  });
}
function subOnTrackChanged() {
  subJob++;
  cancelAsrJob();    // 切歌必须真的掐掉推理：只递增 subJob 只是丢结果，worker 会继续跑满 CPU
  subClearTimer();   // subStart 里 job!==subJob 的提前 return 会跳过 subClearTimer()，换歌/删歌时在这里统一收掉 1s 定时器
  subWakeOff();      // 同理：换歌会让 subStart 提前 return 跳过尾部 subWakeOff()，这里收掉转写期间的唤醒锁
  subRunClear();     // 换歌是主动取消，不是崩溃，别把留痕留给下次启动
  sub.state = 'none'; sub.rec = null; sub.err = ''; sub.dlPct = 0; sub.warn = '';
  subLineEl.textContent = ''; subLineEl.classList.remove('on');
  renderSubList(); renderSubPanel();
  const k = curKey(); if (!k) return;
  subGet(k).then(r => {
    if (r && r.partial && r.doneSeg > 0) {
      // 上次转到一半被打断：先把已有的显示出来，并说明"再点一次生成会接着转"
      sub.rec = r; sub.state = 'ready';
      sub.crash = '上次转到 ' + r.doneSeg + '/'
                + Math.max(1, Math.ceil((r.durationSec || 0) / SUB_SEG_SEC)) + ' 段中断，'
                + '再点一次「生成字幕」会接着转';
    } else if (r && r.chunks && r.chunks.length) { sub.rec = r; sub.state = 'done'; }
    else sub.state = 'ready';
    renderSubPanel(); renderSubList();
    subSyncLine(audio.currentTime * 1000, true);
  });
}

/* ============ 字幕：接线 ============ */
btnSens.addEventListener('click', () => showPanel(panel.hidden ? 'sens' : null));
btnRate.addEventListener('click', () => showPanel(ratePanel.hidden ? 'rate' : null));
A('btnSub').addEventListener('click', () => showPanel(subPanel.hidden ? 'sub' : null));
A('subStart').addEventListener('click', subStart);
A('subStop').addEventListener('click', subStop);
A('subDel').addEventListener('click', async () => {
  const k = curKey(); if (k) await subDelete(k);
  sub.rec = null; sub.state = 'ready'; renderSubList(); renderSubPanel(); subSyncLine(0, true);
});
A('subModel').addEventListener('change', () => { subModel = A('subModel').value; LS.set('subModel', subModel); renderSubPanel(); });

/* ============ 字幕：导出 ============ */
function srtTime(sec) {
  const ms = Math.max(0, Math.round(sec * 1000));
  const p = (n, w = 2) => String(n).padStart(w, '0');
  return p(Math.floor(ms / 3600000)) + ':' + p(Math.floor(ms / 60000) % 60) + ':'
       + p(Math.floor(ms / 1000) % 60) + ',' + p(ms % 1000, 3);
}
function subExport(fmt) {
  if (!sub.rec) return;
  const name = (tracks[cur] && tracks[cur].name || 'subtitle').replace(/\.[^.]+$/, '');
  const body = fmt === 'srt'
    ? sub.rec.chunks.map((c, i) => (i + 1) + '\n' + srtTime(c.s) + ' --> ' + srtTime(c.e) + '\n' + c.text).join('\n\n') + '\n'
    : sub.rec.chunks.map(c => c.text).join('\n') + '\n';
  const url = URL.createObjectURL(new Blob([body], { type: 'text/plain;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = name + '.' + fmt;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
A('subSrt').addEventListener('click', () => subExport('srt'));
A('subTxt').addEventListener('click', () => subExport('txt'));

/* ============ 启动 ============ */
var jsOk = document.getElementById('jsok');
if (jsOk) jsOk.style.display = 'block';   // 只要这段能跑，就显示“JS 运行中”，便于排查
syncSensUI();
startLoop();
loadStored();
sizeDial();
if ('ResizeObserver' in window) {
  // 盯容器而不是圆环本身：圆环的尺寸是这里写死的，它自己不会变，
  // 变的是容器（面板开合、文稿变长、横竖屏切换），旧写法因此不会触发重算。
  new ResizeObserver(function () { sizeDial(); }).observe(document.getElementById('dialWrap'));
}

if ('serviceWorker' in navigator &&
    (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(function () { /* 忽略 */ });
}

renderSubPanel();   // 首屏就按当前状态渲染（无曲目时提示先选歌；有曲目时 loadStored→subOnTrackChanged 会再渲染一次）

// 上次生成若在「准备模型/转写中」阶段留下了记录却没有被清掉，说明页面是在那时被浏览器干掉的
// （崩溃不留任何痕迹，所以只能靠这条记录）。据此给出说明，并在疑似 GPU 路径上自动改走 wasm。
(function interpretLastRun() {
  const last = LS.get(SUB_LS_RUN, null);
  if (!last || sub.state === 'running') return;
  subRunClear();
  let extra = '';
  if (last.stage === 'transcribe' && last.device === 'webgpu' && !LS.get('subAvoidWebgpu', false)) {
    LS.set('subAvoidWebgpu', true);      // GPU 路径疑似把页面搞崩过 → 以后直接走 wasm，不再赌
    extra = '——已自动改用更稳的 wasm 方式';
  }
  sub.crash = '上次生成中断在「' + (last.stage === 'transcribe' ? '转写中' : '准备模型') + '」阶段'
            + (last.device ? '（' + last.device + (last.model ? '，' + last.model : '') + '）' : '')
            + extra + '，请再点一次生成';
  renderSubPanel();
})();
</script>
</body>
</html>
